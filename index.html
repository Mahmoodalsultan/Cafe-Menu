<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAFÉ PÉRA | Home Bar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        /* Dayglow-Inspired Minimalist Aesthetic */
        :root {
            --bg-color: #FAFAFA; /* Stark, clean off-white */
            --text-main: #000000; /* High contrast black */
            --accent: #EAEAEA;
            --font-main: 'Inter', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-main);
            text-transform: uppercase; /* Editorial feel */
            -webkit-font-smoothing: antialiased;
        }

        /* Marquee Header */
        .marquee {
            background-color: var(--text-main);
            color: var(--bg-color);
            padding: 0.5rem 0;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 2px;
            overflow: hidden;
            white-space: nowrap;
        }
        
        .marquee span {
            display: inline-block;
            animation: marquee 15s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        header {
            text-align: center;
            padding: 4rem 1rem;
            border-bottom: 2px solid var(--text-main);
        }

        h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 900;
            letter-spacing: -2px;
            margin: 0;
            line-height: 1;
        }

        .subtitle {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 4px;
            margin-top: 1rem;
        }

        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        .category-wrapper {
            margin-bottom: 5rem;
        }

        h2 {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: -1px;
            border-bottom: 4px solid var(--text-main);
            padding-bottom: 1rem;
            margin-bottom: 3rem;
        }

        /* Stark Editorial Grid */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 3rem 2rem;
        }

        .drink-card {
            cursor: pointer;
            group: hover;
        }

        .drink-img-container {
            width: 100%;
            aspect-ratio: 4/5; /* Portrait style photos */
            background-color: var(--accent);
            overflow: hidden;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid transparent;
            transition: border-color 0.3s ease;
        }

        .drink-card:hover .drink-img-container {
            border-color: var(--text-main);
        }

        .drink-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease, filter 0.3s ease;
            filter: grayscale(20%); /* Slightly muted for aesthetic */
        }

        .drink-card:hover .drink-img-container img {
            transform: scale(1.05);
            filter: grayscale(0%);
        }

        .placeholder-text {
            color: #999;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .drink-info {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-top: 1px solid var(--text-main);
            padding-top: 0.5rem;
        }

        .drink-name {
            font-weight: 900;
            font-size: 1.1rem;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .view-btn {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 1px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .drink-card:hover .view-btn {
            opacity: 1;
        }

        /* Minimalist Modal Popup */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(250, 250, 250, 0.95); /* Bright transparent overlay */
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            transform: translateY(20px);
            transition: transform 0.4s ease;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .close-btn {
            position: fixed;
            top: 2rem;
            right: 3rem;
            font-size: 3rem;
            font-weight: 300;
            color: var(--text-main);
            cursor: pointer;
            background: none;
            border: none;
            font-family: var(--font-main);
        }

        .modal-img {
            width: 100%;
            max-height: 70vh;
            object-fit: contain;
            margin-bottom: 2rem;
        }

        #modal-title {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: -1px;
            margin: 0;
            text-align: center;
            border-bottom: 2px solid var(--text-main);
            padding-bottom: 1rem;
        }

    </style>
</head>
<body>

    <div class="marquee">
        <span>CAFÉ PÉRA — ISTANBUL — DE'LONGHI LA SPECIALISTA MAESTRO — CAREFULLY CRAFTED AT HOME — </span>
    </div>

    <header>
        <h1>CAFÉ PÉRA</h1>
        <div class="subtitle">Home Coffee Bar</div>
    </header>

    <main>
        <section class="category-wrapper">
            <h2>Hot</h2>
            <div class="grid-container" id="hot-drinks">
                </div>
        </section>

        <section class="category-wrapper">
            <h2>Cold</h2>
            <div class="grid-container" id="cold-drinks">
                </div>
        </section>
    </main>

    <div class="modal-overlay" id="drink-modal">
        <button class="close-btn" onclick="closeModal()">×</button>
        <div class="modal-content">
            <img class="modal-img" id="modal-img" src="" alt="Drink Photo" style="display: none;">
            <h3 id="modal-title">Drink Name</h3>
        </div>
    </div>

    <script>
        // Menu Data - Image files connected
        const menuData = {
            hot: [
                { name: "Espresso", image: "IMG_7051.jpg" },
                { name: "Americano", image: "" },
                { name: "Coffee", image: "" },
                { name: "Flat White", image: "" },
                { name: "Latte Macchiato", image: "" },
                { name: "Cappuccino", image: "" },
                { name: "Turkish Coffee", image: "IMG_6465.jpg" },
                { name: "French Coffee", image: "" },
                { name: "Greek Coffee", image: "" },
                { name: "Café Péra Blend", image: "" },
                { name: "Arabic Coffee", image: "IMG_8650.jpg" }
            ],
            cold: [
                { name: "Espresso Cold", image: "" },
                { name: "Cold Brew", image: "" },
                { name: "Desert Velvet Iced", image: "IMG_6992.jpg" }
            ]
        };

        // Function to create the editorial style card
        function createCard(drink) {
            const imgHTML = drink.image 
                ? `<img src="${drink.image}" alt="${drink.name}">`
                : `<div class="placeholder-text">IMAGE PENDING</div>`;

            return `
                <div class="drink-card" onclick="openModal('${drink.name}', '${drink.image || ''}')">
                    <div class="drink-img-container">
                        ${imgHTML}
                    </div>
                    <div class="drink-info">
                        <p class="drink-name">${drink.name}</p>
                        <span class="view-btn">VIEW +</span>
                    </div>
                </div>
            `;
        }

        // Render grids
        document.getElementById('hot-drinks').innerHTML = menuData.hot.map(createCard).join('');
        document.getElementById('cold-drinks').innerHTML = menuData.cold.map(createCard).join('');

        // Modal Logic
        const modal = document.getElementById('drink-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalImg = document.getElementById('modal-img');

        function openModal(drinkName, imageSrc) {
            modalTitle.innerText = drinkName;
            
            if (imageSrc) {
                modalImg.src = imageSrc;
                modalImg.style.display = 'block';
            } else {
                modalImg.style.display = 'none';
            }
            
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
            setTimeout(() => {
                modalImg.src = '';
            }, 400);
        }

        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                closeModal();
            }
        });
    </script>
</body>
</html>
